name: Release server

# Push a tag like server-v0.32.0 (matching server/Cargo.toml) on a commit that
# went through main, and so through staging. The checklist and the
# compatibility rules: docs/operations/releasing.md.
on:
  push:
    tags: ["server-v*"]

concurrency:
  group: release-server
  cancel-in-progress: false

# Each job asks for what it needs; nothing else gets a token that can write.
permissions:
  contents: read

# Three jobs, so nothing that builds code ever runs with production's role:
#   candidate  the checks, then the candidate staging ran, if it's kept and is
#              byte for byte what main's CI built (production role, read only)
#   rebuild    only if it isn't kept: the tests and the build again, with no role
#   release    the binary from one of them, checked again, to production
# The role needs the production environment, so required reviewers added to it
# in GitHub would be asked twice (candidate and release).
jobs:
  candidate:
    name: The candidate staging ran
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      actions: read # whether main's CI put the tagged commit on staging, and what it built
      id-token: write # GitHub OIDC -> the fade-github-deploy role in AWS; no stored keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      rebuild: ${{ steps.fetch.outputs.rebuild }}
      sha256: ${{ steps.fetch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # to check the tag is on main

      - name: Check the tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          [ "$VERSION" = "$CARGO" ] || { echo "tag $VERSION != server/Cargo.toml $CARGO"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "tag a commit on main: it went through CI and staging first"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Production only gets what staging ran (P8): main's CI must have passed
      # for this commit and made its release candidate. Otherwise, stop here.
      - name: Staging ran this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh staging-ran "$(git rev-parse HEAD)"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The exact binary staging ran for this commit, if its sha256 is what
      # main's CI recorded when it built it (release.sh: the record is the build
      # job's own log, which the staging role can't touch). A mismatch stops the
      # release. Only if it's no longer kept (more than ten pushes ago), or has
      # no record, is it built again (the rebuild job); that staging ran this
      # commit at all was checked above.
      - name: Fetch and check it
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.tag.outputs.build }}
        run: |
          status=0
          bash scripts/release.sh fetch-candidate "$BUILD" "$(git rev-parse HEAD)" || status=$?
          case $status in
            0) echo "sha256=$(cat dist/fade-server.sha256)" >> "$GITHUB_OUTPUT" ;;
            3) echo "rebuild=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: steps.fetch.outputs.rebuild != 'true'
        with:
          name: fade-server
          path: dist/fade-server
          retention-days: 7
          if-no-files-found: error

  rebuild:
    name: Test and build again
    needs: candidate
    if: needs.candidate.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Test and build again
        id: build
        env:
          BUILD: ${{ needs.candidate.outputs.build }}
        run: |
          pip install -r tests/requirements.txt ziglang==0.13.0.post1
          bash scripts/test.sh --no-browser
          cargo install cargo-zigbuild --locked
          bash scripts/release.sh build "$BUILD"
          echo "sha256=$(cat dist/fade-server.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fade-server
          path: dist/fade-server
          retention-days: 7
          if-no-files-found: error

  release:
    name: Release to production
    needs: [candidate, rebuild]
    # After the candidate, and after the rebuild when there was one.
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.rebuild.result == 'success' || needs.rebuild.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment in GitHub to gate production deploys.
    environment: production
    permissions:
      contents: write # the GitHub Release, once production is updated
      id-token: write # GitHub OIDC -> the fade-github-deploy role in AWS; no stored keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      APP_NAME: ${{ vars.APP_NAME }}
      APP_URL: ${{ vars.APP_URL }}
      VERSION: ${{ needs.candidate.outputs.version }}
      BUILD: ${{ needs.candidate.outputs.build }}
      SHA256: ${{ needs.rebuild.outputs.sha256 || needs.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the release notes start at the previous server-v* tag
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: fade-server
          path: dist
      - name: The binary the job before checked or built
        run: bash scripts/release.sh check-sha256 "$SHA256"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish the release
        run: bash scripts/release.sh publish "$VERSION"
      - name: Back up production
        run: bash scripts/release.sh backup "$APP_NAME"
      - name: Update production
        run: bash scripts/release.sh update "$APP_NAME" "$APP_URL" "$BUILD"
      # Only now, so a Release on GitHub means it's live (P7).
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh github-release "$VERSION"
