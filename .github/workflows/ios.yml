name: iOS app

# The iOS app (ios/, docs/ios-onboarding.md): the Swift crypto against the
# pinned vectors, then the app's build and unit tests on a simulator. The live
# tests (a real server) skip here; they run on a Mac with a local server.
#
# Runs only when something the app depends on changes; ci.yml's server and
# Terraform checks skip changes that are only in ios/ and the docs.

on:
  pull_request:
    paths: ["ios/**", "tests/vectors/**", "shared/crypto/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", "tests/vectors/**", "shared/crypto/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: iOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: xcodebuild -version
      - name: Crypto against the pinned vectors
        run: swift test --package-path ios/NapsackCrypto
      - name: Build and unit tests (simulator)
        run: >
          xcodebuild test -project ios/Napsack.xcodeproj -scheme Napsack
          -destination "platform=iOS Simulator,name=iPhone 17"
          CODE_SIGNING_ALLOWED=NO
