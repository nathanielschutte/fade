name: Android app

# The Android app (android/, docs/android-onboarding.md): the Kotlin crypto
# against the pinned vectors and the app's logic, on the JVM, and a release
# build's checks. None of it needs an emulator, so it runs on Linux, the cheap
# runner. The emulator tests (the real app, live against a local server) run
# on a machine with an emulator (scripts/test-android.sh).
#
# Runs only by hand (Actions › Android app › Run workflow), never by itself,
# as the iOS app's does: GitHub Actions is billed, so the owner's Mac is the
# Android CI machine to start, and `make android` there is the check before a
# merge (Nate, 2026-11-03; docs/design/android.md). ci.yml's server and
# Terraform checks skip changes that are only in android/ and the docs.

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jvm:
    name: Android app (JVM tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # The runner's SDK may not have API 37 yet: the app builds against its android.jar,
      # and the release build's checks read the APK with build-tools' aapt2.
      - name: Android SDK (API 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      # `make android-jvm`, exactly: the crypto and logic tests, then a release build's checks.
      - name: Crypto against the pinned vectors, the app's logic, and the release build
        run: bash scripts/test-android.sh --no-emulator
