name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server and web client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check
        working-directory: server
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: server

      # Runs shared/crypto against the pinned vectors (the code the iOS app shares).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Unit tests, API smoke test, and browser tests against a throwaway server.
      # GitHub's Ubuntu runners ship Google Chrome, which the browser tests use.
      - name: Test
        run: bash scripts/test.sh
        env:
          NAPSACK_SHOTS: ${{ runner.temp }}/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  mobile:
    name: iOS app
    # temp disable
    if: false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Dependencies match the Expo SDK
        run: npx expo-doctor
      # Bundles the JavaScript the way a build would, including shared/crypto,
      # without building or signing the native app (that's EAS, in the cloud).
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-bundle"
        env:
          EXPO_NO_TELEMETRY: "1"

  infra:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra
