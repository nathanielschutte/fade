name: CI

# Runs on main, once a pull request is merged, or by hand (Actions › CI › Run
# workflow). Not on pull requests, to keep the bill down (Nate, 2026-11-03): a
# pull request is checked locally first (scripts/test.sh, make lint, terraform
# fmt and validate; CLAUDE.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    # On main, a change only to the iOS or Android app or the docs makes no
    # candidate, so it doesn't run at all: that way it can't push a server
    # commit's waiting run out of the queue below.
    paths-ignore: ["ios/**", "android/**", "docs/**", "*.md"]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run. Main's runs aren't cancelled
  # while running, but GitHub keeps only one waiting run per group: if a third
  # push lands while one runs and one waits, the waiting one is cancelled
  # (cdc071e, 2026-10-30). That commit then has no candidate and can't be
  # released (release.sh staging-ran); release the newer one, which includes it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job says otherwise (only the staging deploy does).
permissions:
  contents: read

jobs:
  # Changes only to the iOS or Android app or the docs (the plan included)
  # don't touch the server, the web app, or the infrastructure, so the jobs
  # below skip them; ios.yml and android.yml check the apps. They skip rather
  # than not run: main requires the server and Terraform checks, and a skipped
  # job counts as passing, where a workflow that never ran would leave the pull
  # request waiting.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          # A pull request is checked out as a merge onto main, whose first parent is main.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # Anything outside ios/, android/, docs/, and top-level Markdown runs everything,
          # and so does a base that can't be compared (a new branch, a force push).
          if git rev-parse -q --verify "$BASE^{commit}" >/dev/null &&
             ! git diff --name-only "$BASE" HEAD | grep -qvE '^(ios/|android/|docs/|[^/]+\.md$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only the iOS or Android app or docs changed: the server and Terraform checks skip."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  server:
    name: Server and web client
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check
        working-directory: server
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: server

      # Runs shared/crypto against the pinned vectors (the code the iOS app shares).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Unit tests, API smoke test, and browser tests against a throwaway server.
      # GitHub's Ubuntu runners ship Google Chrome, which the browser tests use.
      - name: Test
        run: bash scripts/test.sh
        env:
          NAPSACK_SHOTS: ${{ runner.temp }}/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # Every push to main that passes becomes a release candidate: built once,
  # kept in S3 as releases/main/fade-server-<sha> (the newest ten), and put on
  # staging. A server-v* tag later promotes that same binary to production
  # (release-server.yml).
  #
  # Built in a job of its own, with no AWS role and no OIDC token, so the
  # toolchain, the cache, and everything the build downloads never hold
  # credentials. Its log records the binary's sha256 (release.sh build), and
  # a release promotes the candidate only if it still has that sha256
  # (release.sh fetch-candidate): the staging role can replace files in
  # releases/main/, but not this job's log. (The name is release.sh's BUILD_JOB.)
  candidate-build:
    name: Build the release candidate
    needs: [server, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.build.outputs.build }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          key: aarch64
      - name: Build
        id: build
        run: |
          BUILD=$(git rev-parse --short=7 HEAD)
          pip install ziglang==0.13.0.post1
          cargo install cargo-zigbuild --locked
          bash scripts/release.sh build "$BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat dist/fade-server.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fade-server
          path: dist/fade-server
          retention-days: 7
          if-no-files-found: error

  # Uploads what the job above built (checked against its sha256 first) and
  # puts it on staging. The only job here with the staging role. Its name is
  # what release.sh staging-ran looks for.
  candidate:
    name: Release candidate on staging
    needs: candidate-build
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> the fade-github-staging role; no stored keys
    # The shared settings (region, bucket, app name) live in the production
    # environment, which this job can't see; it falls back to what Terraform
    # names them (infra/main.tf), and the bucket is found from the account.
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      STAGING_APP: ${{ vars.APP_NAME || 'fade' }}-staging
      STAGING_URL: ${{ vars.STAGING_URL }}
      ROLE: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
      BUILD: ${{ needs.candidate-build.outputs.build }}
      SHA256: ${{ needs.candidate-build.outputs.sha256 }}
    steps:
      - name: Settings
        run: |
          if [ -z "$ROLE" ] || [ -z "$STAGING_URL" ]; then
            echo "::warning::Not deployed: set the STAGING_DEPLOY_ROLE_ARN and STAGING_URL repository variables (terraform output github_actions_variables)."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$STAGING_URL" in https://staging.*) ;; *) echo "STAGING_URL isn't staging's address: $STAGING_URL"; exit 1;; esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.SKIP != '1'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: env.SKIP != '1'
        with:
          name: fade-server
          path: dist
      - name: The binary the build job built
        if: env.SKIP != '1'
        run: bash scripts/release.sh check-sha256 "$SHA256"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.SKIP != '1'
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Artifacts bucket
        if: env.SKIP != '1' && env.BUCKET == ''
        run: echo "BUCKET=fade-artifacts-$(aws sts get-caller-identity --query Account --output text)-$AWS_REGION" >> "$GITHUB_ENV"
      - name: Upload the candidate (keep the newest ten)
        if: env.SKIP != '1'
        run: bash scripts/release.sh candidate "$BUILD"
      - name: Update staging
        if: env.SKIP != '1'
        run: bash scripts/release.sh update "$STAGING_APP" "$STAGING_URL" "$BUILD"

  infra:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra
