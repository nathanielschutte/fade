name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run; main's runs all finish, so
  # every commit on main gets its release candidate (docs/operations/releasing.md).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Changes only to the iOS app or the docs (the plan included) don't touch the
  # server, the web app, or the infrastructure, so the jobs below skip them;
  # ios.yml checks the app. They skip rather than not run: main requires the
  # server and Terraform checks, and a skipped job counts as passing, where a
  # workflow that never ran would leave the pull request waiting.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          # A pull request is checked out as a merge onto main, whose first parent is main.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # Anything outside ios/, docs/, and top-level Markdown runs everything,
          # and so does a base that can't be compared (a new branch, a force push).
          if git rev-parse -q --verify "$BASE^{commit}" >/dev/null &&
             ! git diff --name-only "$BASE" HEAD | grep -qvE '^(ios/|docs/|[^/]+\.md$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only the iOS app or docs changed: the server and Terraform checks skip."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  server:
    name: Server and web client
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check
        working-directory: server
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: server

      # Runs shared/crypto against the pinned vectors (the code the iOS app shares).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Unit tests, API smoke test, and browser tests against a throwaway server.
      # GitHub's Ubuntu runners ship Google Chrome, which the browser tests use.
      - name: Test
        run: bash scripts/test.sh
        env:
          NAPSACK_SHOTS: ${{ runner.temp }}/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # Every push to main that passes becomes a release candidate: built once,
  # kept in S3 as releases/main/fade-server-<sha> (the newest ten), and put on
  # staging. A server-v* tag later promotes that same binary to production
  # (release-server.yml).
  candidate:
    name: Release candidate on staging
    needs: [server, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> the fade-github-staging role; no stored keys
    # The shared settings (region, bucket, app name) live in the production
    # environment, which this job can't see; it falls back to what Terraform
    # names them (infra/main.tf), and the bucket is found from the account.
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      STAGING_APP: ${{ vars.APP_NAME || 'fade' }}-staging
      STAGING_URL: ${{ vars.STAGING_URL }}
      ROLE: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
    steps:
      - name: Settings
        run: |
          if [ -z "$ROLE" ] || [ -z "$STAGING_URL" ]; then
            echo "::warning::Not deployed: set the STAGING_DEPLOY_ROLE_ARN and STAGING_URL repository variables (terraform output github_actions_variables)."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$STAGING_URL" in https://staging.*) ;; *) echo "STAGING_URL isn't staging's address: $STAGING_URL"; exit 1;; esac

      - uses: actions/checkout@v5
        if: env.SKIP != '1'
      - name: Build id
        if: env.SKIP != '1'
        run: echo "BUILD=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP != '1'
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        if: env.SKIP != '1'
        with:
          workspaces: server
          key: aarch64
      - name: Build
        if: env.SKIP != '1'
        run: |
          pip install ziglang==0.13.0.post1
          cargo install cargo-zigbuild --locked
          bash scripts/release.sh build "$BUILD"

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.SKIP != '1'
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Artifacts bucket
        if: env.SKIP != '1' && env.BUCKET == ''
        run: echo "BUCKET=fade-artifacts-$(aws sts get-caller-identity --query Account --output text)-$AWS_REGION" >> "$GITHUB_ENV"
      - name: Upload the candidate (keep the newest ten)
        if: env.SKIP != '1'
        run: bash scripts/release.sh candidate "$BUILD"
      - name: Update staging
        if: env.SKIP != '1'
        run: bash scripts/release.sh update "$STAGING_APP" "$STAGING_URL" "$BUILD"

  infra:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra
