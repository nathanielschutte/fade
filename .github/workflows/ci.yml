name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server and web client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check
        working-directory: server
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: server

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Unit tests, API smoke test, and browser tests against a throwaway server.
      # GitHub's Ubuntu runners ship Google Chrome, which the browser tests use.
      - name: Test
        run: scripts/test.sh
        env:
          NAPSACK_SHOTS: ${{ runner.temp }}/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  infra:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra
