name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run; main's runs all finish, so
  # every commit on main gets its release candidate (docs/operations/releasing.md).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server and web client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check
        working-directory: server
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: server

      # Runs shared/crypto against the pinned vectors (the code the iOS app shares).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Unit tests, API smoke test, and browser tests against a throwaway server.
      # GitHub's Ubuntu runners ship Google Chrome, which the browser tests use.
      - name: Test
        run: bash scripts/test.sh
        env:
          NAPSACK_SHOTS: ${{ runner.temp }}/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # Every push to main that passes becomes a release candidate: built once,
  # kept in S3 as releases/main/fade-server-<sha> (the newest ten), and put on
  # staging. A server-v* tag later promotes that same binary to production
  # (release-server.yml).
  candidate:
    name: Release candidate on staging
    needs: [server, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> the fade-github-staging role; no stored keys
    # The shared settings (region, bucket, app name) live in the production
    # environment, which this job can't see; it falls back to what Terraform
    # names them (infra/main.tf), and the bucket is found from the account.
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      STAGING_APP: ${{ vars.APP_NAME || 'fade' }}-staging
      STAGING_URL: ${{ vars.STAGING_URL }}
      ROLE: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
    steps:
      - name: Settings
        run: |
          if [ -z "$ROLE" ] || [ -z "$STAGING_URL" ]; then
            echo "::warning::Not deployed: set the STAGING_DEPLOY_ROLE_ARN and STAGING_URL repository variables (terraform output github_actions_variables)."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$STAGING_URL" in https://staging.*) ;; *) echo "STAGING_URL isn't staging's address: $STAGING_URL"; exit 1;; esac

      - uses: actions/checkout@v5
        if: env.SKIP != '1'
      - name: Build id
        if: env.SKIP != '1'
        run: echo "BUILD=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP != '1'
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        if: env.SKIP != '1'
        with:
          workspaces: server
          key: aarch64
      - name: Build
        if: env.SKIP != '1'
        run: |
          pip install ziglang==0.13.0.post1
          cargo install cargo-zigbuild --locked
          bash scripts/release.sh build "$BUILD"

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.SKIP != '1'
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Artifacts bucket
        if: env.SKIP != '1' && env.BUCKET == ''
        run: echo "BUCKET=fade-artifacts-$(aws sts get-caller-identity --query Account --output text)-$AWS_REGION" >> "$GITHUB_ENV"
      - name: Upload the candidate (keep the newest ten)
        if: env.SKIP != '1'
        run: bash scripts/release.sh candidate "$BUILD"
      - name: Update staging
        if: env.SKIP != '1'
        run: bash scripts/release.sh update "$STAGING_APP" "$STAGING_URL" "$BUILD"

  mobile:
    name: iOS app
    # temp disable
    if: false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Dependencies match the Expo SDK
        run: npx expo-doctor
      # Bundles the JavaScript the way a build would, including shared/crypto,
      # without building or signing the native app (that's EAS, in the cloud).
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-bundle"
        env:
          EXPO_NO_TELEMETRY: "1"

  infra:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra
