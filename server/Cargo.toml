[package]
name = "fade-server"
version = "0.31.1"
edition = "2021"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
libc = "0.2"
# Pure-Rust (memory-safe) decoders for cleaning uploaded images; see src/images.rs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
bytes = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower-http = { version = "0.6", features = ["set-header"] }
# Web Push (src/push.rs): VAPID signing and RFC 8291 payload encryption, all pure Rust.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
# Signs the few AWS calls the Metrics tab makes (src/aws.rs), instead of the AWS SDK.
hmac = "0.12"
aes-gcm = "0.10"
# Sends pushes to the browsers' push services over HTTPS (rustls, no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
